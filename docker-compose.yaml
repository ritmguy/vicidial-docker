services:

  db:
    container_name: vicidial-db
    build:
      context: './docker'
      dockerfile: 'Dockerfile'
      target: db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-S", "/tmp/mysql.sock"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 20s
    env_file:
      - './docker/mysql/mysql.env'
    network_mode: host
    volumes:
      - db_data:/var/lib/mysql
      - db_log:/var/log/mysql

  dialer:
    container_name: vicidial-dialer
    build:
      context: './docker'
      dockerfile: 'Dockerfile'
      target: dialer
      args:
        - VICI_DB=127.0.0.1
        - VICI_HOST=${LOCAL_IP}
        - VICI_EXT_IP=${LOCAL_IP}
    environment:
      - VICI_HOST=${LOCAL_IP}
      - VICI_DB=127.0.0.1
    restart: unless-stopped
    depends_on:
      db:
        condition: 'service_healthy'
    network_mode: host

  web:
    container_name: vicidial-web
    build:
      context: './docker'
      dockerfile: 'Dockerfile'
      target: web
      args:
        - VICI_DB=127.0.0.1
        - VICI_HOST=${LOCAL_IP}
        - VICI_EXT_IP=${LOCAL_IP}
        - VICI_WEB_HOST=true
    restart: unless-stopped
    depends_on:
      db:
        condition: 'service_healthy'
    network_mode: host
    # tty gives readable logs in dev; comment out in production
    tty: true

  # SSL (later track): Caddy-in-front is the planned direction, not certbot.
  # certbot:
  #   image: certbot/certbot
  #   volumes_from:
  #     - web
  #   command: certonly --keep-until-expiring --standalone --email test@test.com --agree-tos --no-eff-email -d vici-dev.protect247.app
