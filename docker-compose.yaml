services:

  db:
    container_name: vicidial-db
    build:
      context: './docker'
      dockerfile: 'Dockerfile'
      target: db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-S", "/tmp/mysql.sock"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 20s
    env_file:
      - './docker/mysql/mysql.env'
    network_mode: host
    volumes:
      - db_data:/var/lib/mysql
      - db_log:/var/log/mysql

  dialer:
    container_name: vicidial-dialer
    build:
      context: './docker'
      dockerfile: 'Dockerfile'
      target: dialer
      args:
        - VICI_DB=${VICI_DB:-127.0.0.1}
        - VICI_HOST=${LOCAL_IP}
        - VICI_EXT_IP=${LOCAL_IP}
    environment:
      - VICI_HOST=${LOCAL_IP}
      # Intentionally empty by default (not :-127.0.0.1): if this were ever set
      # unconditionally, a runtime start without VICI_DB would silently rewrite
      # astguiclient.conf to 127.0.0.1, overriding whatever was baked in at
      # build time with --build-arg VICI_DB=<host>. Leaving it empty lets the
      # entrypoint fall back to the build-time value when no runtime value is given.
      - VICI_DB=${VICI_DB:-}
      # Only needed when several dialers share one database: set this to the
      # node's own VICIdial server_id so it can identify its own row in
      # `servers`. Left unset for a single-server install, where the one row is
      # unambiguous. Without it, a node sharing a DB refuses to realign any
      # server's IP rather than risk overwriting another dialer's registration.
      - VICI_SERVER_ID=${VICI_SERVER_ID:-}
    restart: unless-stopped
    # No depends_on: a dialer may run on a host with no local database, and
    # naming a service (`docker-compose up -d dialer`) is how a role is selected.
    # The entrypoint waits for the database itself (mysqladmin ping, 60 x 2s),
    # which also covers a remote host.
    network_mode: host
    # DAHDI software timing. VICIdial's own ConfBridge docs call for this: the
    # default res_timing_timerfd.so is disturbed whenever Asterisk forks (which
    # VICIdial does constantly, for AGI), and that makes ConfBridge skip audio
    # frames. The entrypoint detects this device and noloads the userspace timers.
    #
    # REQUIRES the dahdi kernel module on this host -- see "Dialer host
    # requirements" in README.md. Without /dev/dahdi/timer, `docker-compose up`
    # will FAIL here rather than start a container with bad audio timing.
    # No kmod available? See docker-compose.no-dahdi.yaml (not for production).
    devices:
      - /dev/dahdi/timer:/dev/dahdi/timer
    volumes:
      # Call recordings and voicemail. Asterisk writes recordings to
      # /var/spool/asterisk/monitor and VICIdial's cron mixes/compresses them
      # into monitorDONE/. Without this volume all of it lives in the container's
      # writable layer and is destroyed every time the container is recreated --
      # including on a routine `docker-compose up -d --build`.
      # A named volume (not a bind mount) so the monitor* directory structure
      # built into the image is used to initialise it rather than shadowed.
      - asterisk_spool:/var/spool/asterisk

  web:
    container_name: vicidial-web
    build:
      context: './docker'
      dockerfile: 'Dockerfile'
      target: web
      args:
        - VICI_DB=${VICI_DB:-127.0.0.1}
        - VICI_HOST=${LOCAL_IP}
        - VICI_EXT_IP=${LOCAL_IP}
        - VICI_WEB_HOST=true
    restart: unless-stopped
    # No depends_on: the web role may run on a host with no local database.
    # Apache serves immediately; PHP connects per request.
    network_mode: host
    # tty gives readable logs in dev; comment out in production
    tty: true

  # SSL (later track): Caddy-in-front is the planned direction, not certbot.
  # certbot:
  #   image: certbot/certbot
  #   volumes_from:
  #     - web
  #   command: certonly --keep-until-expiring --standalone --email test@test.com --agree-tos --no-eff-email -d vici-dev.protect247.app
  #   network_mode: host

# Bridge networks (kept commented; host networking is the default for SIP/RTP media)
# networks:
#   backend:
#     name: vici-backend
#     driver: bridge
#     internal: true
#     ipam:
#       driver: default
#       config:
#         - subnet: 10.10.10.0/24
#   frontend:
#     name: vici-frontend
#     driver: bridge

volumes:
  db_data:
  db_log:
  asterisk_spool:
